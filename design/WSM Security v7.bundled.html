  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<style>\n  html, body { height: 100%; margin: 0; background: #0c0d0f; }\n  ::selection { background: #ff5a41; color: #0c0d0f; }\n  a { color: #ff5a41; text-decoration: none; }\n  a:hover { color: #ff8570; }\n  input::placeholder { color: #9aa0a8; }\n  *:focus-visible { outline: 2px solid #ff5a41; outline-offset: 2px; }\n  .pane { scrollbar-width: thin; scrollbar-color: transparent transparent; }\n  .pane.wsm-scrolling { scrollbar-color: var(--line4, #4a4f56) transparent; }\n  .pane::-webkit-scrollbar { width: 10px; height: 10px; }\n  .pane::-webkit-scrollbar-track { background: transparent; }\n  .pane::-webkit-scrollbar-thumb { background: transparent; border: 3px solid transparent; background-clip: padding-box; }\n  .pane.wsm-scrolling::-webkit-scrollbar-thumb { background: var(--line4, #4a4f56); background-clip: padding-box; }\n  @keyframes wsm-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }\n  @keyframes wsm-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }\n  @keyframes wsm-in-a { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n  @keyframes wsm-in-b { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n  @keyframes wsm-row-a { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }\n  @keyframes wsm-row-b { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }\n  @keyframes wsm-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }\n  @keyframes wsm-sub-slide { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }\n  @keyframes wsm-sub-wipe { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes wsm-scrim { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes wsm-spin { to { transform: rotate(360deg); } }\n  button, select, input, [data-row] { transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, box-shadow 200ms ease, opacity 200ms ease; }\n  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"--ac: {{ t.ac }}; --ac-text: {{ t.acText }}; --ac-hov: {{ t.acHov }}; --ac-hi: {{ t.acHi }}; --ac-soft: {{ t.acSoft }}; --ac-soft2: {{ t.acSoft2 }}; --ac-tint: {{ t.acTint }}; --ac-tint2: {{ t.acTint2 }}; --ac-tint3: {{ t.acTint3 }}; --ac-ground: {{ t.acGround }}; --ac-mid: {{ t.acMid }}; --bg: {{ t.bg }}; --chrome: {{ t.chrome }}; --surf: {{ t.surf }}; --surf2: {{ t.surf2 }}; --line0: {{ t.line0 }}; --line1: {{ t.line1 }}; --line2: {{ t.line2 }}; --line3: {{ t.line3 }}; --line4: {{ t.line4 }}; --ink: {{ t.ink }}; --ink2: {{ t.ink2 }}; --ink3: {{ t.ink3 }}; --muted: {{ t.muted }}; --muted2: {{ t.muted2 }}; --muted3: {{ t.muted3 }}; --on-ac: {{ t.onAc }}; --ac2: {{ t.ac2 }}; --ac2-text: {{ t.ac2Text }}; --ac2-tint: {{ t.ac2Tint }}; --ac2-soft: {{ t.ac2Soft }}; --fail: {{ t.fail }}; --fail-tint: {{ t.failTint }}; height: 100vh; box-sizing: border-box; display: grid; grid-template-columns: {{ railW }} minmax(0, 1fr); transition: grid-template-columns 180ms ease; padding: {{ z.shellPad }}; gap: {{ z.shellGap }}; background: {{ z.shellBg }}; color: var(--ink, #eef0f2); font-family: Archivo, system-ui, sans-serif; overflow: hidden;\">\n\n  <aside class=\"pane\" style=\"background: {{ z.railBg }}; border-right: {{ z.railEdge }}; box-shadow: {{ z.railShadow }}; display: flex; flex-direction: column; overflow: auto;\">\n    <sc-if value=\"{{ railOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <d ult&quot;:&quot;gold&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Color theme&quot;},&quot;secondAccent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;electric&quot;,&quot;hot&quot;,&quot;acid&quot;,&quot;gold&quot;,&quot;jade&quot;,&quot;grape&quot;,&quot;signal&quot;,&quot;amber&quot;,&quot;cyan&quot;,&quot;violet&quot;,&quot;emerald&quot;,&quot;magenta&quot;,&quot;ice&quot;,&quot;lime&quot;,&quot;tangerine&quot;,&quot;steel&quot;],&quot;default&quot;:&quot;emerald&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Color theme&quot;},&quot;paneStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;flat&quot;,&quot;inset&quot;,&quot;framed&quot;,&quot;floating&quot;],&quot;default&quot;:&quot;floating&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;subPanel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;overlay&quot;,&quot;sheet&quot;,&quot;stacked&quot;,&quot;push&quot;],&quot;default&quot;:&quot;sheet&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;statusIcons&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;box&quot;,&quot;bare&quot;,&quot;solid&quot;,&quot;dot&quot;],&quot;default&quot;:&quot;solid&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;recordStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rows&quot;,&quot;cards&quot;],&quot;default&quot;:&quot;cards&quot;,&quot;tsType&quot;:&quot;\\&quot;rows\\&quot; | \\&quot;cards\\&quot;&quot;,&quot;section&quot;:&quot;Hacksaw&quot;},&quot;guidelineSet&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;extended&quot;],&quot;default&quot;:&quot;extended&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Preview data&quot;}}\">\nconst OK = [\n  { id: \"G8\", title: \"Risk statement traceable to an asset\" },\n  { id: \"G9\", title: \"Control documented and owned\" },\n  { id: \"G10\", title: \"Reviewed within the agreed cadence\" }\n];\nconst pass = ids => OK.filter(g => ids.includes(g.id)).map(g => ({ ...g, pass: true, issues: [] }));\nconst g6 = issues => ({ id: \"G6\", title: \"Likelihood and impact scored\", pass: issues.length === 0, issues });\nconst fail = (id, title, issues) => ({ id, title, pass: false, issues });\n\nconst RISKS = [\n  { team: \"Log360 Cloud\", issue: \"Unintended write actions by the MCP client or Zia Agent\", vulnerability: \"LLMs may misinterpret user prompts and select an unintended tool (e.g., invoking “Close Alert” instead of “Get Alert Details”), leading to unintended modifications in Log360 Cloud.\", threat: \"Due to LLM hallucination, the MCP client or Zia Agent may incorrectly invoke a write operation – such as closing an alert, updating an incident status, or deleting a configuration – when the user only intended a read or query action.\", risk: \"Legitimate alerts may get closed, incident statuses may be altered, or configurations may be modified without the user's explicit intent.\", score: 5,\n    controlFull: \"Write operations (update, delete, close) in Log360 Cloud REST APIs require appropriate role-based permissions – users with Operator role have restricted write access. API throttle limits cap the volume of any unintended actions. Most MCP clients (VS Code Copilot, Claude, Cursor) display the tool name and parameters to the user for confirmation before execution. Admins can selectively exclude write-action tools when configuring the MCP server in Zoho MCP or the agent in Zia Agents, limiting the agent to read-only operations. Any write action performed is logged in the org's audit log for traceability.\",\n    treatment: \"Risk Modification\", owner: \"Mangala N V\", register: \"ISMS\", reviewed: \"25 Jun 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Log360 and EventLog Analyzer\", issue: \"Release gets extended beyond the ETA provided to customers when dependent QA and documentation tasks slip past the committed sprint window\", vulnerability: \"Dependent tasks get delayed\", threat: \"Release schedule delayed\", risk: \"Customers waiting for the release\", score: 4,\n    controlFull: \"Testing is added as part of the release checklist, and the release board reviews slipped ETAs in the weekly sync before committing an external date.\",\n    treatment: \"Risk Modification\", owner: \"Praveen Kumar P\", register: \"QMS\", reviewed: \"02 Sep 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Log360 Cloud\", issue: \"Product restart due to Java heap space\", vulnerability: \"Poor memory management, inefficient GC configuration\", threat: \"System crashes due to GC overuse\", risk: \"Product downtime, performance degradation\", score: 6,\n    controlFull: \"No control recorded against this risk. The guideline set requires a documented control for any risk rated High.\",\n    treatment: \"Risk Avoidance\", owner: \"Suresh Babu\", register: \"ISMS\", reviewed: \"28 Aug 2026\", recent: true,\n    guidelines: [\n      g6([\n        { text: \"Required field 'likelihood' is empty.\", suggestion: \"Fill in 'likelihood' in the register entry.\" },\n        { text: \"Required field 'impact' is empty.\", suggestion: \"Fill in 'impact' in the register entry.\" }\n      ]),\n      ...pass([\"G8\"]),\n      fail(\"G9\", \"Control documented and owned\", [\n        { text: \"No control is recorded for a risk rated High.\", suggestion: \"Record the mitigating control and name an owner accountable for it.\" }\n      ]),\n      ...pass([\"G10\"])\n    ] },\n  { team: \"Log360 Cloud\", issue: \"Clarity on features\", vulnerability: \"No proper documentation and approval process for feature scope\", threat: \"Customers unable to use the product, misconfiguration\", risk: \"Inaccurate help content and misunderstanding of the feature\", score: 4,\n    controlFull: \"Once the feature development is signed off, a documentation review is mandatory before the build is promoted, and the writer signs the release note.\",\n    treatment: \"Risk Modification\", owner: \"Aarti Nair\", register: \"QMS\", reviewed: \"26 Aug 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Log360 Cloud\", issue: \"Build validation is taking longer than desired\", vulnerability: \"Feature releases might get delayed\", threat: \"Validation window overruns the release slot\", risk: \"Product will not be able to keep up with the roadmap\", score: 4,\n    controlFull: \"No control recorded. Build validation duration is tracked in CMTools but is not yet linked to this register entry.\",\n    treatment: \"Risk Retention\", owner: \"Praveen Kumar P\", register: \"QMS\", reviewed: \"12 Jul 2024\", recent: false,\n    guidelines: [\n      g6([{ text: \"Required field 'impact' is empty.\", suggestion: \"Fill in 'impact' in the register entry.\" }]),\n      ...pass([\"G8\"]),\n      fail(\"G9\", \"Control documented and owned\", [\n        { text: \"Control field reads 'no control recorded'.\", suggestion: \"Link the CMTools validation SLA as the documented control.\" }\n      ]),\n      fail(\"G10\", \"Reviewed within the agreed cadence\", [\n        { text: \"Last review was more than 12 months ago (12 Jul 2024).\", suggestion: \"Schedule a review with the risk owner this cycle.\" }\n      ])\n    ] },\n  { team: \"Log360 Cloud\", issue: \"Releasing a feature with issues due to improper testing\", vulnerability: \"Features with bugs will be available to the customer\", threat: \"Features are released with quality errors and deployed in production\", risk: \"The features are not working as expected\", score: 6,\n    controlFull: \"1. Test case authoring is reviewed by a second engineer. 2. Peer review is required before release sign-off, and the QA lead records the exception if it is skipped.\",\n    treatment: \"Risk Modification\", owner: \"Meera Krishnan\", register: \"QMS\", reviewed: \"21 Aug 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Log360 and EventLog Analyzer\", issue: \"Few test cases are missed during development\", vulnerability: \"Missed test cases are found at validation time\", threat: \"Requires additional validation to check the bugs\", risk: \"Release process gets delayed\", score: 4,\n    controlFull: \"At development time various test scenarios are captured in the spec, and the validation team reconciles the executed set against it before sign-off.\",\n    treatment: \"Risk Modification\", owner: \"Vikram Iyer\", register: \"QMS\", reviewed: \"19 Aug 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Log360 and EventLog Analyzer\", issue: \"Performance issue with large customer datasets\", vulnerability: \"It occurs when there is huge data with the customer\", threat: \"Product becomes unstable\", risk: \"Product and company reputation is affected\", score: 4,\n    controlFull: \"Performance testing is added as part of the release cycle with a fixed dataset profile, and regressions above the agreed threshold block the release.\",\n    treatment: \"Risk Modification\", owner: \"Suresh Babu\", register: \"ISMS\", reviewed: \"16 Aug 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Log360 Cloud\", issue: \"SLA violation on customer tickets\", vulnerability: \"Significant workload or unavailability of an assignee\", threat: \"Team member failing to respond within the SLA\", risk: \"Loss of customer satisfaction\", score: 3,\n    controlFull: \"In case of a spike in workload or planned leave, tickets are reassigned by the duty manager and the SLA clock is reviewed in the daily handover.\",\n    treatment: \"Risk Modification\", owner: \"Aarti Nair\", register: \"BCMS\", reviewed: \"14 Aug 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Identity Platform\", issue: \"Stale access for transferred employees\", vulnerability: \"Role changes are not reflected in the access matrix\", threat: \"Former team members retain production access\", risk: \"Unauthorised access to customer data\", score: 7,\n    controlFull: \"Quarterly access recertification is run against the HR transfer feed; any account unclaimed after two cycles is disabled automatically.\",\n    treatment: \"Risk Modification\", owner: \"Meera Krishnan\", register: \"PIMS\", reviewed: \"09 Sep 2026\", recent: true,\n    guidelines: [g6([]), ...pass([\"G8\", \"G9\", \"G10\"])] },\n  { team: \"Identity Platform\", issue: \"Consent records not retained for the full period\", vulnerability: \"Retention job prunes consent logs with session data\", threat: \"Consent evidence unavailable at audit\", risk: \"Regulatory finding on lawful basis\", score: 5,\n    controlFull: \"Consent records were moved to a separate retention class in August; the pruning job now excludes them, pending verification in the next audit window.\",\n    treatment: \"Risk Modification\", owner: \"Aarti Nair\", register: \"PIMS\", reviewed: \"05 Sep 2026\", recent: true,\n    guidelines: [\n      g6([]),\n      fail(\"G8\", \"Risk statement traceable to an asset\", [\n        { text: \"No asset is linked to this entry.\", suggestion: \"Link the consent store asset from the ISMS asset register.\" }\n      ]),\n      ...pass([\"G9\", \"G10\"])\n    ] },\n  { team: \"Cloud Infrastructure\", issue: \"Single-region failover untested this year\", vulnerability: \"Failover runbook has not been exercised since the last migration\", threat: \"Recovery exceeds the agreed RTO\", risk: \"Extended outage for cloud customers\", score: 6,\n    controlFull: \"A failover exercise is scheduled for the October maintenance window, with the runbook reviewed against the current topology beforehand.\",\n    treatment: \"Risk Modification\", owner: \"Suresh Babu\", register: \"BCMS\", reviewed: \"01 Sep 2026\", recent: true,\n    guidelines: [\n      g6([]),\n      ...pass([\"G8\"]),\n      fail(\"G9\", \"Control documented and owned\", [\n        { text: \"The recorded control is a planned activity, not an operating one.\", suggestion: \"Note the interim control in force until the October exercise.\" }\n      ]),\n      ...pass([\"G10\"])\n    ] },\n  { team: \"Cloud Infrastructure\", issue: \"Backup restore verified only by checksum\", vulnerability: \"No functional restore test on production snapshots\", threat: \"Backups restore but data is unusable\", risk: \"Data loss during a recovery event\", score: 3,\n    controlFull: \"Monthly checksum verification runs automatically; a functional restore into the staging estate is planned but not yet scheduled.\",\n    treatment: \"Risk Retention\", owner: \"Vikram Iyer\", register: \"BCMS\", reviewed: \"30 Aug 2024\", recent: false,\n    guidelines: [\n      g6([]),\n      ...pass([\"G8\", \"G9\"]),\n      fail(\"G10\", \"Reviewed within the agreed cadence\", [\n        { text: \"Last review was more than 12 months ago (30 Aug 2024).\", suggestion: \"Schedule a review with the risk owner this cycle.\" }\n      ])\n    ] }\n];\n\nconst CONTROL_LIB = {\n  \"A.5.15\": { title: \"Access control\", text: \"Rules to control physical and logical access to information and other associated assets are established and implemented based on business and security requirements.\" },\n  \"A.5.16\": { title: \"Identity management\", text: \"The full life cycle of identities is managed, so every action can be attributed to a known user or service identity.\" },\n  \"A.5.18\": { title: \"Access rights\", text: \"Access rights to information and other associated assets are provisioned, reviewed, modified and removed in line with the workspace access policy.\" },\n  \"A.5.30\": { title: \"ICT readiness for business continuity\", text: \"ICT readiness is planned, implemented, maintained and tested against the business continuity objectives and the agreed recovery time.\" },\n  \"A.5.34\": { title: \"Privacy and protection of PII\", text: \"Requirements for the preservation of privacy and protection of personally identifiable information are identified and met per applicable law.\" },\n  \"A.5.37\": { title: \"Documented operating procedures\", text: \"Operating procedures for information processing facilities are documented and made available to the personnel who need them.\" },\n  \"A.8.2\": { title: \"Privileged access rights\", text: \"The allocation and use of privileged access rights is restricted and managed through an approval and periodic recertification process.\" },\n  \"A.8.6\": { title: \"Capacity management\", text: \"The use of resources is monitored and adjusted in line with current and expected capacity requirements, including customer data volume.\" },\n  \"A.8.10\": { title: \"Information deletion\", text: \"Information stored in information systems, devices or in any other storage media is deleted when no longer required.\" },\n  \"A.8.13\": { title: \"Information backup\", text: \"Backup copies of information, software and systems are maintained and regularly tested in accordance with the agreed backup policy.\" },\n  \"A.8.14\": { title: \"Redundancy of information processing facilities\", text: \"Information processing facilities are implemented with redundancy sufficient to meet the availability requirements of the service.\" },\n  \"A.8.16\": { title: \"Monitoring activities\", text: \"Networks, systems and applications are monitored for anomalous behaviour and appropriate action is taken to evaluate potential incidents.\" },\n  \"A.8.18\": { title: \"Use of privileged utility programs\", text: \"The use of utility programs capable of overriding system and application controls is restricted and tightly controlled.\" },\n  \"A.8.29\": { title: \"Security testing in development and acceptance\", text: \"Security testing processes are defined and implemented in the development lifecycle, including acceptance criteria before promotion.\" },\n  \"A.8.31\": { title: \"Separation of development, test and production environments\", text: \"Development, test and production environments are separated and secured so that changes cannot bypass the release path.\" },\n  \"A.8.32\": { title: \"Change management\", text: \"Changes to information processing facilities and information systems are subject to the documented change management procedure.\" },\n  \"CCM CCC-02\": { title: \"Quality testing\", text: \"Follow a defined quality change control and testing process with established baselines, testing and release standards.\" },\n  \"CCM CCC-03\": { title: \"Change management technology\", text: \"Manage the risks associated with applying changes to the organisation's assets, including their technology and configuration.\" },\n  \"CCM CCC-04\": { title: \"Unauthorized change protection\", text: \"Restrict the unauthorised addition, removal, update and management of organisation assets outside the change process.\" },\n  \"CCM CCC-05\": { title: \"Change agreements\", text: \"Include provisions limiting changes that directly impact tenants' owned environments to explicitly authorised requests.\" },\n  \"CCM CCC-07\": { title: \"Detection of baseline deviation\", text: \"Implement detection measures with proactive notification when changes deviate from the established configuration baseline.\" },\n  \"CCM IVS-04\": { title: \"Secure configuration\", text: \"Harden host and guest OS, hypervisor and infrastructure control plane per their respective baselines and monitor for drift.\" },\n  \"CCM LOG-05\": { title: \"Audit log monitoring and response\", text: \"Monitor security audit logs to detect activity outside typical or expected patterns and take defined response
