name: Build validation

# Build/validate only — actual deployment to Catalyst happens through
# Catalyst's native GitHub integration on push to main, not this workflow.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install function dependencies
        working-directory: ./functions/welcome
        run: npm install

      - name: Validate function code
        working-directory: ./functions/welcome
        run: node -c index.js

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
